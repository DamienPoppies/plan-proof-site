name: Clear Pages lock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/pages/deployments" -o pages.json
          echo "RAW:"; head -c 600 pages.json; echo
          ids=$(python3 -c "
import json
data = json.load(open('pages.json'))
items = data if isinstance(data, list) else data.get('deployments', data.get('items', []))
print(' '.join(str(d.get('id')) for d in items if d.get('id')))
")
          echo "IDS: $ids"
          for id in $ids; do
            echo "CANCEL $id"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" "$API/pages/deployments/$id/cancel" | head -c 300; echo
          done
