name: Clear Pages deployment lock
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          echo "== list pages deployments =="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/pages/deployments" -o pages.json
          head -c 800 pages.json; echo
          ids=$(python3 -c "
import json
try:
    data = json.load(open('pages.json'))
except Exception:
    print(''); raise SystemExit
if isinstance(data, list):
    print(' '.join(str(d.get('id')) for d in data))
else:
    print('')
")
          echo "candidate ids: $ids"
          for id in $ids; do
            echo "-> cancelling pages deployment $id"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "$API/pages/deployments/$id/cancel" | head -c 300; echo
          done
